<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JioSaavn API – Documentation</title>
<style>
:root{
  --bg:#f7f6f2;--panel:rgba(255,255,255,.72);--panel-solid:#fff;--text:#18181b;--muted:#71717a;
  --border:rgba(24,24,27,.08);--border-strong:rgba(24,24,27,.18);
  --accent:#6366f1;--accent-2:#14b8a6;--accent-soft:rgba(99,102,241,.10);--on-accent:#fff;
  --code:rgba(24,24,27,.045);--get:#0d9488;--warn:#b45309;--err:#dc2626;--ok:#16a34a;
  --glass:rgba(247,246,242,.72);--shadow:0 1px 2px rgba(24,24,27,.04),0 10px 30px -14px rgba(24,24,27,.14);
  --blob1:#c7d2fe;--blob2:#a7f3d0;--blob3:#fed7aa;--blob-op:.6;--hh:60px;color-scheme:light}
:root[data-theme=dark]{
  --bg:#0a0a0d;--panel:rgba(24,24,30,.55);--panel-solid:#131318;--text:#ededf0;--muted:#8b8b96;
  --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.16);
  --accent:#8b8dfb;--accent-2:#2dd4bf;--accent-soft:rgba(139,141,251,.14);--on-accent:#0b0b12;
  --code:rgba(255,255,255,.05);--get:#2dd4bf;--warn:#fbbf24;--err:#f87171;--ok:#4ade80;
  --glass:rgba(10,10,13,.7);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -16px rgba(0,0,0,.6);
  --blob1:#4338ca;--blob2:#0f766e;--blob3:#9a3412;--blob-op:.3;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a0a0d;--panel:rgba(24,24,30,.55);--panel-solid:#131318;--text:#ededf0;--muted:#8b8b96;
  --border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.16);
  --accent:#8b8dfb;--accent-2:#2dd4bf;--accent-soft:rgba(139,141,251,.14);--on-accent:#0b0b12;
  --code:rgba(255,255,255,.05);--get:#2dd4bf;--warn:#fbbf24;--err:#f87171;--ok:#4ade80;
  --glass:rgba(10,10,13,.7);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px -16px rgba(0,0,0,.6);
  --blob1:#4338ca;--blob2:#0f766e;--blob3:#9a3412;--blob-op:.3;color-scheme:dark}}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace}
::selection{background:var(--accent-soft);color:var(--text)}
a{color:var(--accent);text-decoration:none;transition:opacity .2s}a:hover{opacity:.75}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}

/* ambient background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-op);will-change:transform;transition:opacity .6s}
.bg i:nth-child(1){width:48vw;height:48vw;left:-12vw;top:-16vw;background:var(--blob1);animation:d1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:10vh;background:var(--blob2);animation:d2 34s ease-in-out infinite alternate}
.bg i:nth-child(3){width:36vw;height:36vw;left:30vw;bottom:-20vw;background:var(--blob3);animation:d3 40s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vw,14vh) scale(.9)}}
@keyframes d3{to{transform:translate(-10vw,-12vh) scale(1.2)}}

/* header */
header{position:sticky;top:0;z-index:30;height:var(--hh);display:flex;gap:14px;align-items:center;padding:0 22px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--border);transition:box-shadow .3s}
header.scrolled{box-shadow:0 8px 30px -18px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{opacity:1}
.brand small{color:var(--muted);font-weight:500;font-size:12px}
.orb{width:18px;height:18px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent-2),#f59e0b,var(--accent));animation:spin 9s linear infinite;box-shadow:0 0 16px -3px var(--accent);-webkit-mask:radial-gradient(circle,transparent 3px,#000 3.5px);mask:radial-gradient(circle,transparent 3px,#000 3.5px)}
@keyframes spin{to{transform:rotate(360deg)}}
.base{display:flex;align-items:center;gap:8px;flex:1;min-width:240px;max-width:620px;margin:0 auto;padding:3px 3px 3px 14px;background:var(--code);border:1px solid var(--border);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.base:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.base label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.base input{flex:1;min-width:0;padding:5px 4px;border:0;outline:0;background:transparent;color:var(--text);font:13px ui-monospace,Menlo,monospace}
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--border-strong);background:var(--panel-solid);color:var(--text);border-radius:999px;font-size:13px;font-weight:500;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.btn:hover{border-color:var(--accent);opacity:1;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 12px}
.btn.ghost:hover{background:var(--panel-solid);color:var(--text)}
.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:600;box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{box-shadow:0 10px 26px -8px var(--accent)}
.btn.icon{width:36px;height:36px;padding:0;border-radius:50%;flex-shrink:0}
.btn.icon svg{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.btn.icon:hover svg{transform:rotate(25deg)}
.i-sun{display:none}
:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .i-sun{display:block}:root:not([data-theme=light]) .i-moon{display:none}}

/* hero */
.hero{text-align:center;padding:84px 24px 40px}
.hero-in{max-width:720px;margin:0 auto}
.hero-in>*{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.hero-in>:nth-child(2){animation-delay:.08s}.hero-in>:nth-child(3){animation-delay:.16s}
.hero-in>:nth-child(4){animation-delay:.24s}.hero-in>:nth-child(5){animation-delay:.34s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid var(--border);border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);font-size:12px;color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.title{font-size:clamp(38px,7vw,64px);line-height:1.05;letter-spacing:-.04em;font-weight:750;margin:22px 0 14px;background:linear-gradient(110deg,var(--text) 15%,var(--accent) 50%,var(--accent-2) 85%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:up .9s cubic-bezier(.2,.7,.2,1) both,shine 9s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.lede{font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:560px;margin:0 auto 26px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.cta .btn{padding:10px 22px;font-size:14px}
.hero .cw{max-width:620px;margin:0 auto;text-align:left}
.hero pre{background:var(--panel);backdrop-filter:blur(12px);box-shadow:var(--shadow);color:var(--text)}

/* layout */
.layout{display:flex;max-width:1280px;margin:0 auto}
nav{width:272px;flex-shrink:0;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow:auto;padding:16px 14px 40px 22px}
nav input{width:100%;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--code);color:var(--text);margin-bottom:12px;font:13px inherit;outline:0;transition:border-color .2s,box-shadow .2s}
nav input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
nav h4{margin:20px 0 6px 10px;font-size:10.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav a{position:relative;display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:8px;color:var(--muted);font-size:13px;transition:background .2s,color .2s}
nav a:hover{background:var(--code);color:var(--text);opacity:1}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:550}
nav a.on::before{content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:2px;border-radius:2px;background:var(--accent)}
nav a .m{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--get);width:24px;flex-shrink:0;opacity:.85}
nav a span.p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;padding:20px 32px 90px}

/* typography */
section.intro h2,section.group>h2{font-size:24px;margin:48px 0 10px;letter-spacing:-.025em;font-weight:700}
section.intro>h2:first-child{margin-top:0}
p{margin:8px 0}.muted{color:var(--muted)}
pre{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.6;margin:0}
:not(pre)>code{background:var(--code);padding:2px 7px;border-radius:6px;font-size:.87em}
.cw{position:relative;margin:10px 0}
.copy{position:absolute;top:8px;right:8px;padding:3px 10px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:999px;background:var(--panel-solid);color:var(--muted);opacity:0;transition:opacity .2s,color .2s,border-color .2s}
.cw>pre{padding-right:76px}
.cw:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{color:var(--text);border-color:var(--border-strong)}.copy.done{color:var(--ok);opacity:1}
@media(hover:none){.copy{opacity:.85}}

/* endpoint cards */
.card{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:18px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s,opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover{border-color:var(--border-strong)}
.card[open]{border-color:var(--border-strong);box-shadow:0 18px 50px -24px rgba(99,102,241,.35)}
.card>summary{position:relative;list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:15px 48px 15px 18px;flex-wrap:wrap;transition:background .2s}
.card>summary::-webkit-details-marker{display:none}
.card>summary:hover{background:var(--code)}
.card>summary::after{content:"";position:absolute;right:20px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .3s cubic-bezier(.2,.7,.2,1),margin .3s}
.card[open]>summary::after{transform:rotate(-135deg);margin-top:-2px}
.badge{font:700 10.5px ui-monospace,monospace;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--get) 14%,transparent);color:var(--get)}
.card .path{font:600 14px ui-monospace,Menlo,monospace}
.card .path i{color:var(--accent);font-style:normal}
.card .sum{color:var(--muted);font-size:13px;margin-left:auto}
.body{padding:4px 20px 20px;border-top:1px solid var(--border)}
.card[open]>.body{animation:open .45s cubic-bezier(.2,.7,.2,1)}
@keyframes open{from{opacity:0;transform:translateY(-8px)}}
.body h3{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);padding:7px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--code)}
tr:last-child td{border-bottom:0}
td.n{font-family:ui-monospace,monospace;font-weight:600;white-space:nowrap}
td.t{font-family:ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.req{color:var(--err);font-size:10.5px;font-weight:600;margin-left:8px}
.opt{color:var(--muted);font-size:10.5px;margin-left:8px;opacity:.8}
.pill{display:inline-block;font:11px ui-monospace,monospace;background:var(--code);border:1px solid var(--border);padding:0 8px;border-radius:999px;margin:2px 4px 0 0}

/* tabs */
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--code);border-radius:11px;flex-wrap:wrap}
.tabs button{padding:5px 13px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;transition:background .2s,color .2s,box-shadow .2s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel-solid);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.resp-panes{border-top:0!important;padding-top:6px!important}
.pane{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

.note{background:var(--accent-soft);border-left:2px solid var(--accent);padding:9px 14px;border-radius:0 10px 10px 0;font-size:13px;margin:10px 0}

/* try it */
.try{background:var(--code);border:1px solid var(--border);border-radius:14px;padding:14px}
.try .row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.try input{padding:7px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel-solid);color:var(--text);font:12.5px ui-monospace,monospace;width:100%;outline:0;transition:border-color .2s,box-shadow .2s}
.try input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.try .url{font:12px ui-monospace,monospace;word-break:break-all;color:var(--muted);margin:10px 0 12px}
.try pre.out{max-height:340px;background:var(--panel-solid);display:none;margin-top:12px;animation:fade .35s ease}
.status{font:600 12px ui-monospace,monospace;margin-left:10px}
.ok{color:var(--ok)}.bad{color:var(--err)}
details.fields>summary{cursor:pointer;color:var(--accent);font-size:13px;margin:10px 0;transition:opacity .2s}
details.fields>summary:hover{opacity:.7}
.code-pill{font:700 12px ui-monospace,monospace;padding:2px 10px;border-radius:999px;background:var(--code)}
.c2{color:var(--ok)}.c4{color:var(--warn)}
.empty{display:none;color:var(--muted);padding:10px 8px;font-size:13px}
footer{color:var(--muted);font-size:12px;margin-top:64px;padding-top:20px;border-top:1px solid var(--border)}

/* scroll reveal */
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none}

@media(max-width:860px){
  header{padding:0 14px;gap:8px}.brand small{display:none}.base label{display:none}.base{min-width:0}
  nav{display:none}main{padding:16px 16px 60px}.hero{padding:56px 18px 28px}
  .card .sum{margin-left:0;width:100%}.try .row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header id="top">
  <a class="brand" href="#"><i class="orb"></i><span>JioSaavn API</span><small id="ver"></small></a>
  <div class="base"><label for="base">Base URL</label><input id="base" spellcheck="false" autocomplete="off"><button class="btn ghost" id="reset" title="Reset to the URL this page is served from">Reset</button></div>
  <button class="btn icon" id="theme" aria-label="Toggle theme" title="Toggle theme">
    <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="progress"></div>
</header>

<div class="hero">
  <div class="hero-in">
    <span class="chip"><i class="dot"></i><span id="ver2"></span><span>·</span><span id="epcount"></span><span>·</span><span>JSON</span></span>
    <h1 class="title">JioSaavn API</h1>
    <p class="lede">Songs, albums, artists and playlists over simple GET requests — with download links in every quality.</p>
    <div class="cta"><a class="btn primary" href="#quickstart">Quick start</a><a class="btn" href="#g-Search">Browse endpoints</a></div>
    <pre data-tpl="curl -s &quot;{BASE}/api/search/songs?query=Believer&amp;limit=2&quot;"></pre>
  </div>
</div>

<div class="layout">
<nav><input id="q" placeholder="Filter endpoints…" type="search"><div id="navlinks"></div></nav>
<main id="main"></main>
</div>

const introHTML=`
<section class="intro" id="introduction">
<h2>Introduction</h2>
<p>An unofficial REST API for searching and fetching songs, albums, artists and playlists from <a href="https://www.jiosaavn.com" target="_blank" rel="noopener">JioSaavn</a>, including download links in multiple qualities. All endpoints are <code>GET</code> requests that return JSON.</p>
<h2 id="base-url">Base URL</h2>
<p>Every request is made relative to the URL this API is deployed at. This page detects it automatically, so all examples below use your own deployment:</p>
<pre><code data-base>${esc(BASE)}</code></pre>
<p class="muted">If you opened this file locally or want to test another deployment, change the Base URL field at the top of the page; examples and the "Try it" panels update instantly. You can also pass <code>?base=https://your-deployment</code> in the page URL.</p>
<h2 id="quickstart">Quick start</h2>
<pre data-tpl="curl -s &quot;{BASE}/api/search/songs?query=Believer&amp;limit=2&quot;"></pre>
<h2 id="response-format">Response format</h2>
<p>Successful responses wrap the payload in a <code>success</code> flag and a <code>data</code> object or array:</p>
<pre>{
  "success": true,
  "data": { ... }
}</pre>
<p>Pagination uses zero-based <code>page</code> and <code>limit</code> query parameters where supported. Search endpoints return <code>total</code>, <code>start</code> and <code>results</code> inside <code>data</code>.</p>
<h2 id="status-codes">Status codes</h2>
<table><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody>
<tr><td class="n c2">200</td><td>Request succeeded.</td></tr>
<tr><td class="n c4">400</td><td>Query parameters are missing or invalid (for example neither <code>id</code> nor <code>link</code> was given).</td></tr>
<tr><td class="n c4">404</td><td>The requested song, album, artist or playlist was not found.</td></tr>
</tbody></table>
<h2 id="media">Images and audio links</h2>
<p>Images and download links come back as arrays of <code>{ quality, url }</code> objects, so you can pick the resolution or bitrate you need (for example images such as <code>150x150</code>, <code>500x500</code> and audio such as <code>96kbps</code>, <code>160kbps</code>, <code>320kbps</code>).</p>
<h2 id="cors">Using it from a browser</h2>
<pre data-tpl="const res = await fetch('{BASE}/api/songs/3IoDK8qI');
const { success, data } = await res.json();
console.log(data[0].name);"></pre>
</section>`;

function pathHTML(p){return esc(p).replace(/\{(\w+)\}/g,'<i>{$1}</i>')}
function exVal(p){return p.example!=null?p.example:(p.default!=null?p.default:'')}

function buildURL(ep,vals,withBase=true){
  let path=ep.path.replace(/\{(\w+)\}/g,(_,k)=>encodeURIComponent(vals[k]??''));
  const qs=ep.params.filter(p=>p.in==='query'&&vals[p.name]!==undefined&&vals[p.name]!=='').map(p=>encodeURIComponent(p.name)+'='+encodeURIComponent(vals[p.name]));
  return (withBase?BASE:'')+path+(qs.length?'?'+qs.join('&'):'');
}
function sampleVals(ep){
  const v={};const ps=ep.params;
  const either=ps.some(p=>p.name==='link')&&ps.every(p=>!p.required||p.in==='path');
  ps.forEach(p=>{
    if(p.in==='query'&&!p.required&&either&&p.name==='link')return;
    if(p.in==='query'&&!p.required&&!['page','limit'].includes(p.name)&&!either&&p.name!=='limit')return;
    v[p.name]=exVal(p);
  });
  return v;
}
function snippets(ep){
  const url=buildURL(ep,sampleVals(ep));
  return {
    curl:`curl -s "${url}"`,
    js:`const res = await fetch("${url}");\nconst json = await res.json();\nconsole.log(json.data);`,
    py:`import requests\n\nres = requests.get("${url}")\nprint(res.json()["data"])`

}
function renderTpl(el){el.textContent=el.dataset.tpl.replace(/\{BASE\}/g,BASE)}

function paramsTable(ep){
  if(!ep.params.length)return '<p class="muted">No parameters.</p>';
  const either=ep.params.filter(p=>!p.required&&['id','ids','link'].includes(p.name));
  let note='';
  if(either.length>=2&&either.some(p=>p.name==='link'))note=`<div class="note">Provide one of ${either.map(p=>`<code>${p.name}</code>`).join(' or ')}. Requests with none of them return <code>400</code>.</div>`;
  return note+`<table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>`+
  ep.params.map(p=>`<tr><td class="n">${esc(p.name)}${p.required?'<span class="req">required</span>':'<span class="opt">optional</span>'}</td><td class="t">${p.in}</td><td class="t">${esc(p.type)}</td><td class="t">${p.default!=null?esc(p.default):'—'}</td><td>${esc(p.desc)}${p.enum?'<br>'+p.enum.map(e=>`<span class="pill">${esc(e)}</span>`).join(''):''}${p.example!=null&&p.example!==''?`<br><span class="muted">e.g. </span><code>${esc(p.example)}</code>`:''}</td></tr>`).join('')+`</tbody></table>`;
}
function fieldsTable(fields){
  return `<table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody>`+fields.map(f=>`<tr><td class="n">${esc(f.path)}</td><td class="t">${esc(f.type)}</td><td>${esc(f.desc)}</td></tr>`).join('')+`</tbody></table>`;
}
function respBlock(ep){
  const tabs=ep.responses.map((r,i)=>`<button data-i="${i}" class="${i?'':'on'}">${r.code}</button>`).join('');
  const panes=ep.responses.map((r,i)=>{
    let inner=`<p><span class="code-pill ${r.code[0]==='2'?'c2':'c4'}">${r.code}</span> ${esc(r.desc)}</p>`;
    if(r.example!==undefined){
      inner+=`<pre>${esc(JSON.stringify(r.example,null,2))}</pre>`;
      if(r.fields&&r.fields.length)inner+=`<details class="fields"><summary>Show all response fields (${r.fields.length})</summary>${fieldsTable(r.fields)}</details>`;
    } else if(r.code!=='200'){
      inner+=`<pre>{\n  "success": false,\n  "message": "..."\n}</pre><p class="muted">Error responses use <code>success: false</code> with a message describing the problem.</p>`;
    }
    return `<div class="pane" data-i="${i}" style="${i?'display:none':''}">${inner}</div>`;
  }).join('');
  return `<div class="tabs resp-tabs">${tabs}</div><div class="resp-panes" style="border-top:1px solid var(--border);padding-top:10px">${panes}</div>`;

function tryBlock(ep){

function card(ep){

function build(){
  const groups=TAG_ORDER.filter(t=>eps.some(e=>e.tag===t));
  eps.forEach(e=>{if(!groups.includes(e.tag))groups.push(e.tag)});
  let nav=`<h4>Overview</h4><a href="#introduction"><span class="p">Introduction</span></a><a href="#base-url"><span class="p">Base URL</span></a><a href="#quickstart"><span class="p">Quick start</span></a><a href="#response-format"><span class="p">Response format</span></a><a href="#status-codes"><span class="p">Status codes</span></a>`;
  let html=introHTML;
  groups.forEach(t=>{
    const list=eps.filter(e=>e.tag===t);
    nav+=`<h4>${TAG_TITLE[t]||t}</h4>`+list.map(e=>`<a href="#${e.id}" data-search="${esc((e.path+' '+e.summary).toLowerCase())}"><span class="m">GET</span><span class="p">${esc(e.path.replace('/api',''))}</span></a>`).join('');
    html+=`<section class="group" id="g-${t}"><h2>${TAG_TITLE[t]||t}</h2>`+list.map(card).join('')+`</section>`;
  });

  $$('.snip').forEach(el=>{const ep=eps.find(e=>e.id===el.dataset.ep);el.dataset.k='curl';el.textContent=snippets(ep).curl});
  $$('.try').forEach(updateUrl);
}

document.addEventListener('input',e=>{if(e.target.closest('.try'))updateUrl(e.target.closest('.try'))});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.closest('.code-tabs')){
    const c=b.closest('.card');$$('.code-tabs button',c).forEach(x=>x.classList.toggle('on',x===b));
    const pre=$('.snip',c);pre.dataset.k=b.dataset.k;pre.textContent=snippets(epOf(b))[b.dataset.k];return;

});
// open card when navigated to by hash
function openHash(){const c=location.hash&&document.getElementById(location.hash.slice(1));if(c&&c.tagName==='DETAILS')c.open=true}
addEventListener('hashchange',openHash);
build();openHash();
/* ---- polish: animation & interaction (additive, does not alter the API logic above) ---- */
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#ver2').textContent='v'+SPEC.version;
$('#epcount').textContent=eps.length+' endpoints';

// copy buttons on every code block (except live response output)
$$('pre').forEach(pre=>{
  if(pre.classList.contains('out'))return;
  const w=document.createElement('div');w.className='cw';
  pre.parentNode.insertBefore(w,pre);w.appendChild(pre);
  const b=document.createElement('button');
  b.type='button';b.className='copy';b.textContent='Copy';b.setAttribute('aria-label','Copy code');
  b.onclick=async()=>{
    try{await navigator.clipboard.writeText(pre.textContent);b.textContent='Copied';b.classList.add('done')}
    catch{b.textContent='Press Ctrl+C'}
    setTimeout(()=>{b.textContent='Copy';b.classList.remove('done')},1400);
  };
  w.appendChild(b);
});

// scroll reveal
if(!reduce&&'IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}
  }),{rootMargin:'0px 0px -6% 0px',threshold:.04});
  $$('.card,section.group>h2,section.intro>h2,section.intro>p,section.intro>.cw,section.intro>table').forEach(el=>{
    el.classList.add('rv');io.observe(el);
  });
}

// header: progress bar + shadow, nav scroll-spy
const bar=$('#progress'),hdr=$('header'),nav=$('nav');
const links=[...$$('#navlinks a[href^="#"]')];
const targets=links.map(a=>document.getElementById(a.getAttribute('href').slice(1)));
let active=null,ticking=false;
function frame(){
  ticking=false;
  const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
  bar.style.transform=`scaleX(${max>0?Math.min(1,h.scrollTop/max):0})`;
  hdr.classList.toggle('scrolled',h.scrollTop>8);
  let idx=-1;
  for(let i=0;i<targets.length;i++){
    const t=targets[i];
    if(!t||t.offsetParent===null)continue;
    if(t.getBoundingClientRect().top<=110)idx=i;else break;
  }
  const a=idx>=0?links[idx]:null;
  if(a!==active){
    if(active)active.classList.remove('on');
    if(a){
      a.classList.add('on');
      const r=a.getBoundingClientRect(),nr=nav.getBoundingClientRect();
      if(nr.height&&(r.top<nr.top+50||r.bottom>nr.bottom-50))
        nav.scrollTo({top:nav.scrollTop+r.top-nr.top-nr.height/2,behavior:reduce?'auto':'smooth'});
    }
    active=a;
  }
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(frame)}},{passive:true});
addEventListener('resize',frame);
$('#q').addEventListener('input',()=>requestAnimationFrame(frame));
frame();
})();
</script>
</body>
</html>
